<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pakke System | Ecommerce</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        :root {
            --main-color: #fd4646;
            --text-color: #02ac70;
            --bg-color: #fff;
            --container-color: #1e1e2a;
            --panel-color: #2d2e37;
        }

        body {
            background-color: var(--container-color);
            color: var(--bg-color);
            margin: 0;
            padding: 4rem 0 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background-color: var(--container-color);
            padding: 0;
            width: 100%;
            max-width: 1068px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            margin: 0 0 1.8rem;
        }

        .mode-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .mode-btn {
            background-color: var(--panel-color);
            color: var(--bg-color);
            border: 1px solid transparent;
            padding: 10px 20px;
            border-radius: 2rem;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
        }

        .mode-btn:hover { color: var(--text-color); }
        .mode-btn.active { background-color: var(--text-color); color: var(--bg-color); border-color: var(--text-color); }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .camera-section { display: flex; flex-direction: column; gap: 15px; }
        .video-container {
            width: 100%;
            aspect-ratio: 16 / 10;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #444;
            background-color: #000;
            display: flex;
            justify-content: center;
        }

        .video-container img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .action-buttons { display: flex; gap: 10px; }
        .btn-action {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 2rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--bg-color);
            transition: 0.3s;
        }

        .btn-scan { background-color: var(--text-color); }
        .btn-scan:hover { background-color: #028c5c; }
        .btn-reset { background-color: var(--main-color); }
        .btn-reset:hover { background-color: #d93636; }

        .status-section { background-color: var(--panel-color); border-radius: 5px; padding: 20px; }
        .status-section h2 { margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 10px; font-size: 1.2rem; }
        .log-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; max-height: 400px; }
        .log-list li {
            background: var(--container-color); padding: 12px; margin-bottom: 8px; border-radius: 5px;
            border-left: 4px solid var(--text-color); font-size: 0.9rem;
        }
        .log-list li:first-child { border-left-color: var(--main-color); font-weight: 600; }
        .purchased-section { background-color: var(--panel-color); border-radius: 5px; padding: 20px; margin-top: 1.5rem; }
        .purchased-section h2 { margin-top: 0; font-size: 1.2rem; }
        .purchased-list { display: grid; gap: 8px; }
        .purchased-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--container-color); padding: 10px 12px; border-radius: 5px; }
        .purchased-item small { display: block; color: #aaa; }
        .select-item { flex: 0 0 auto; border: 0; border-radius: 1.5rem; padding: 8px 12px; background: var(--text-color); color: white; cursor: pointer; }
        .select-item.selected { background: var(--main-color); }
        .empty-purchased { color: #aaa; margin: 0; }

        @media (max-width: 1080px) {
            body { padding: 3rem 5% 2rem; }
        }

        @media (max-width: 768px) {
            .main-content { grid-template-columns: 1fr; }
        }

        @media (max-width: 480px) {
            body { padding: 2rem 1rem; }
            h1 { font-size: 1.2rem; }
            .mode-btn { width: 100%; }
            .action-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 E-Commerce Logistik System (Python + OpenCV)</h1>

    <!-- TILSTANDSKNAPPER -->
    <div class="mode-tabs" id="modeTabs">
        <button class="mode-btn active" data-mode="vis">👁️ Vis</button>
        <button class="mode-btn" data-mode="hent">📥 Hent fra lager</button>
        <button class="mode-btn" data-mode="send">🚚 Send pakke</button>
        <button class="mode-btn" data-mode="modtag">🏭 Modtag varer</button>
        <button class="mode-btn" data-mode="refunder">🔄 Refunder</button>
    </div>

    <div class="main-content">
        <!-- KAMERA (Streamet fra Python) -->
        <div class="camera-section">
            <div class="video-container">
                <!-- Her hentes video fra Python Flask -->
                <img src="{{ url_for('video_feed') }}" alt="Kamera Stream">
            </div>
            
            <div class="action-buttons">
                <button class="btn-action btn-scan" onclick="manualScan()">🔍 Manuel Scan</button>
                <button class="btn-action btn-reset" onclick="resetSystem()">🗑️ Nulstil</button>
            </div>
        </div>

        <!-- STATUS OG LOG -->
        <div class="status-section">
            <h2>System Log</h2>
            <ul class="log-list" id="logList">
                <!-- Logs indsættes her via JavaScript -->
            </ul>
        </div>
    </div>

    <section class="purchased-section">
        <h2>Købte varer klar til scanning</h2>
        <div class="purchased-list" id="purchasedList">
            <p class="empty-purchased">Indlæser købte varer...</p>
        </div>
    </section>
</div>

<script>
    // JavaScript der kommunikerer med Python-serveren
    const shopApi = 'http://localhost/open%20cv%20ecom/api';
    let selectedItem = null;
    
    // 1. Skift tilstand
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const mode = btn.dataset.mode;
            fetch('/set_mode', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mode: mode })
            });
        });
    });

    // 2. Manuel Scan
    function manualScan() {
        fetch('/manual_scan', { method: 'POST' });
    }

    // 3. Nulstil
    function resetSystem() {
        fetch('/reset', { method: 'POST' });
    }

    async function loadPurchasedItems() {
        const list = document.getElementById('purchasedList');
        try {
            const response = await fetch(`${shopApi}/get_pending_orders.php`);
            const items = await response.json();
            list.innerHTML = '';

            if (!Array.isArray(items) || items.length === 0) {
                list.innerHTML = '<p class="empty-purchased">Ingen købte varer endnu.</p>';
                return;
            }

            items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'purchased-item';
                row.innerHTML = `
                    <div><strong></strong><small></small></div>
                    <button class="select-item" type="button">Vælg</button>
                `;
                row.querySelector('strong').textContent = `${item.product_title} x${item.quantity}`;
                row.querySelector('small').textContent = `Ordre #${item.order_id} · VAR-${item.product_id}`;
                row.querySelector('button').addEventListener('click', () => selectPurchasedItem(item, row));
                list.appendChild(row);
            });
        } catch (error) {
            list.innerHTML = '<p class="empty-purchased">Kunne ikke hente købte varer.</p>';
        }
    }

    async function selectPurchasedItem(item, row) {
        const response = await fetch('/select_item', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                order_id: item.order_id,
                product_id: item.product_id,
                title: item.product_title
            })
        });
        if (!response.ok) return;
        selectedItem = item;
        document.querySelectorAll('.select-item').forEach(button => {
            button.classList.remove('selected');
            button.textContent = 'Vælg';
        });
        const button = row.querySelector('button');
        button.classList.add('selected');
        button.textContent = 'Valgt';
    }

    // 4. Hent status fra Python (Polling hvert 1. sekund)
    function fetchStatus() {
        fetch('/get_status')
            .then(response => response.json())
            .then(data => {
                const logList = document.getElementById('logList');
                logList.innerHTML = ''; // Ryd nuværende liste
                
                // Tilføj logs
                data.log.forEach((msg, index) => {
                    const li = document.createElement('li');
                    li.innerText = msg;
                    if (index === 0) li.style.fontWeight = 'bold'; // Fremhæv nyeste
                    logList.appendChild(li);
                });
            });
    }

    // Kør fetchStatus konstant
    setInterval(fetchStatus, 1000);
    fetchStatus(); // Kør med det samme
    loadPurchasedItems();
    setInterval(loadPurchasedItems, 5000);
</script>
</body>
</html>
